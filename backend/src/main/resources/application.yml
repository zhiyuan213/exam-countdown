# ============================================================
# 环境变量可直接覆盖（Spring 宽松绑定）：本地写死的值只是默认值，
# 云托管部署时在控制台配环境变量即可，无需改代码。
#
#   WX_APPID / WX_SECRET / WX_TEMPLATE_ID / WX_CLOUD_CALL
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   REMIND_JOB_TOKEN
#
# ⚠️ 安全：以下默认值一律留空/占位，禁止再把真实密钥写进仓库。
#    线上凭据曾泄露（AppSecret / 数据库密码 / REMIND_JOB_TOKEN），务必全部轮换。
# ============================================================
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/exam_countdown?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always   # 启动时执行 schema.sql（全部 IF NOT EXISTS，可重复启动）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  template-id: ${WX_TEMPLATE_ID:}
  cloud-call: ${WX_CLOUD_CALL:true}   # true=云托管云调用通道(http 自动注入 token)；本地开发设 false 走 https+secret
  # ------------------------------------------------------------
  # 虚拟支付（二期）：购买「提醒额度包」。开通后把下面几项配到云托管环境变量。
  # 未配置时 enabled=false，/api/pay/* 会明确返回「支付功能尚未开通」，不影响其他功能。
  #   XPAY_ENABLED           总开关，开通虚拟支付并自测通过后再置 true
  #   XPAY_OFFER_ID          mp 后台「虚拟支付 → 基础配置」里的 OfferID
  #   XPAY_APP_KEY           现网 AppKey（密钥！只配到环境变量，不要提交到仓库）
  #   XPAY_APP_KEY_SANDBOX   沙箱 AppKey（env=1 时使用）
  #   XPAY_ENV               0 现网 / 1 沙箱
  #   XPAY_PUSH_TOKEN        mp 后台「消息推送」配置的 Token，用于校验发货推送来源
  #   XPAY_GOODS             额度包配置 goodsId:priceFen:quota:name，多项用 ; 分隔
  # ⚠️ goodsId 必须与后台「道具管理」里的道具 ID 完全一致，priceFen 必须与后台价格完全一致，
  #    否则拉起支付会被微信侧拒绝。iOS 端可能存在最低金额门槛，如遇报错把单价调到 ≥ 6 元再试。
  # ------------------------------------------------------------
  pay:
    enabled: ${XPAY_ENABLED:false}
    offer-id: ${XPAY_OFFER_ID:}
    appkey: ${XPAY_APP_KEY:}
    appkey-sandbox: ${XPAY_APP_KEY_SANDBOX:}
    env: ${XPAY_ENV:0}
    push-token: ${XPAY_PUSH_TOKEN:}
    goods: ${XPAY_GOODS:quota10:600:10:+10 个提醒额度;quota30:1200:30:+30 个提醒额度}

remind:
  cron: "0 0 8 * * ?"          # 每天 08:00 推送；调试时可临时改成 "*/30 * * * * ?"
  nodes: ${REMIND_NODES:30,7,1,0}                 # 兜底提醒点：按类型配置里没命中时才用它
  # 按节点类型区分的提醒点（可用环境变量 REMIND_NODES_BY_TYPE 覆盖）。
  # 原因：一次授权只能推一条，推送命中最靠前的提醒点就扣额度，所以每个类型最该被提醒的时刻要放最前面。
  nodes-by-type: ${REMIND_NODES_BY_TYPE:EXAM:1,0;SCORE:1,0;RETEST:1,0;VOLUNTEER:1,0;ADMISSION:1,0;SIGNUP:3,1,0;TICKET:7,1,0}
  custom-nodes: ${REMIND_CUSTOM_NODES:1,0}        # 用户自建提醒：考前 1 天及当天（一次性订阅要逐次授权，点太多体验差）
  job-token: ${REMIND_JOB_TOKEN:change-me}  # 云托管定时任务调用 /api/job/remind 的口令

# 用户自建提醒额度：free_quota 默认 3（建行时写入 user_quota 表，改这里不影响已存在的行）。
# 二期接入虚拟支付后，支付回调会给 user_quota.paid_quota 累加额度。
