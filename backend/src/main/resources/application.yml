# ============================================================
# 环境变量可直接覆盖（Spring 宽松绑定）：本地写死的值只是默认值，
# 云托管部署时在控制台配环境变量即可，无需改代码。
#
#   WX_APPID / WX_SECRET / WX_TEMPLATE_ID / WX_CLOUD_CALL
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   REMIND_JOB_TOKEN
#
# ⚠️ 安全：以下默认值一律留空/占位，禁止再把真实密钥写进仓库。
#    线上凭据曾泄露（AppSecret / 数据库密码 / REMIND_JOB_TOKEN），务必全部轮换。
# ============================================================
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/exam_countdown?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: always   # 启动时执行 schema.sql（全部 IF NOT EXISTS，可重复启动）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  template-id: ${WX_TEMPLATE_ID:}
  cloud-call: ${WX_CLOUD_CALL:true}   # true=云托管云调用通道(http 自动注入 token)；本地开发设 false 走 https+secret

remind:
  cron: "0 0 8 * * ?"          # 每天 08:00 推送；调试时可临时改成 "*/30 * * * * ?"
  nodes: "30,7,1,0"            # 官方节点提醒：考前 30/7/1 天及当天
  custom-nodes: "1,0"          # 用户自建提醒：考前 1 天及当天（一次性订阅要逐次授权，点太多体验差）
  job-token: ${REMIND_JOB_TOKEN:change-me}  # 云托管定时任务调用 /api/job/remind 的口令

# 用户自建提醒额度：free_quota 默认 3（建行时写入 user_quota 表，改这里不影响已存在的行）。
# 二期接入虚拟支付后，支付回调会给 user_quota.paid_quota 累加额度。
